[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-ai-brain"
version = "12.2.0"
description = "Sovereign AI Brain (Route B: Native Windows RTX 3050 4GB Hybrid Gated DeltaNet + Looped Core + Deterministic Exoskeleton Harness)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.5.5",
]

[project.optional-dependencies]
cuda = [
    "torch>=2.15.0",
    "triton-windows>=3.9.0,<3.10.0; sys_platform == 'win32'",
    "flash-linear-attention>=0.6.0",
    "liger-kernel>=0.8.5",
    "cut-cross-entropy>=25.1.1",
    "transformers>=5.24.0",
    "tokenizers>=0.23.3",
    "huggingface-hub>=2.4.0",
    "hf-xet>=1.8.0",
    "datasets>=5.2.0",
    "safetensors>=0.8.0",
    "torchao>=0.18.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.17.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
